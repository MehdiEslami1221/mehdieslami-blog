name: Publish blog
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity.publish]
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blog-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci --no-audit --no-fund
      - run: npm run sync
      - run: npm run typecheck
      - run: npm test
      - run: npm run studio:build
        env:
          SANITY_TELEMETRY_DISABLED: "1"
      - name: Build published content
        run: npm run build
        env:
          BLOG_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BLOG_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
