name: Publish blog
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity.publish]
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blog-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci --no-audit --no-fund
      - run: npm run sync
      - run: npm run typecheck
      - run: npm test
      - run: git diff --check
      - run: npm run studio:build
        env:
          SANITY_TELEMETRY_DISABLED: "1"
      - name: Deploy article reactions
        id: reactions
        run: node scripts/deploy-reactions.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build published content
        run: npm run build -w web && node scripts/finish-export.mjs
        env:
          BLOG_REACTIONS_URL: ${{ steps.reactions.outputs.url }}
          BLOG_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BLOG_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Name deployment artifact
        id: artifact-name
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: web/out
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
